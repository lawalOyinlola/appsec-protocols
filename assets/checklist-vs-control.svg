<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">A checklist item compared with an executable control</title>
  <desc id="desc">On the left, a declarative checklist item: verify that session tokens are invalidated when the password is changed. It gets read, agreed with and ticked, and nothing is run. On the right, control 9 states the same requirement with a verify step: log in on two browsers, change the password in one, refresh the other, and expect a 401. If the other browser is still logged in, that is the bug.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .label { fill: #57606a; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; }
    .body { fill: #1f2328; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strong { font-weight: 600; }
    .muted { fill: #57606a; font: italic 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail { fill: #fff1f0; stroke: #cf222e; }
    .failtext { fill: #a40e26; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pass { fill: #edfaf0; stroke: #1a7f37; }
    .passtext { fill: #116329; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arrow { stroke: #57606a; fill: none; stroke-width: 2; }
    .arrowhead { fill: #57606a; }
    .arrowlabel { fill: #57606a; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .label, .muted, .arrowlabel { fill: #8b949e; }
      .body { fill: #e6edf3; }
      .fail { fill: #2d1214; stroke: #f85149; }
      .failtext { fill: #ff7b72; }
      .pass { fill: #0f2a18; stroke: #3fb950; }
      .passtext { fill: #56d364; }
      .arrow { stroke: #8b949e; }
      .arrowhead { fill: #8b949e; }
    }
  </style>

  <rect class="bg" width="880" height="330" rx="12"/>

  <!-- Left: the declarative item -->
  <rect class="card" x="20" y="20" width="370" height="290" rx="10"/>
  <text class="label" x="44" y="54">A CHECKLIST ITEM</text>
  <text class="body" x="44" y="92">Verify that session tokens are</text>
  <text class="body" x="44" y="116">invalidated when the password</text>
  <text class="body" x="44" y="140">is changed.</text>
  <text class="muted" x="44" y="190">Read it. Agree with it. Tick it.</text>
  <rect class="fail" x="44" y="232" width="322" height="50" rx="8"/>
  <text class="failtext" x="62" y="262">Result: nothing was run</text>

  <!-- Arrow -->
  <path class="arrow" d="M398 165 H 470"/>
  <path class="arrowhead" d="M478 165 l -10 -6 v 12 z"/>
  <text class="arrowlabel" x="438" y="152" text-anchor="middle">rewritten</text>

  <!-- Right: the control -->
  <rect class="card" x="490" y="20" width="370" height="290" rx="10"/>
  <text class="label" x="514" y="54">CONTROL 9</text>
  <text class="body" x="514" y="92">Kill every session on password</text>
  <text class="body" x="514" y="116">change, not just the current one.</text>
  <text class="body strong" x="514" y="160">Verify:</text>
  <text class="body" x="514" y="184">log in on two browsers, change the</text>
  <text class="body" x="514" y="208">password in one, refresh the other.</text>
  <rect class="pass" x="514" y="232" width="322" height="50" rx="8"/>
  <text class="passtext" x="532" y="262">Expect 401. Still logged in? Bug.</text>
</svg>
